name: Update forecast

# Runs the pipeline hourly and publishes whatever it publishes locally (build/) to S3,
# for the deployed web app to read via VITE_DATA_BASE. It never touches git: build/ and
# data/ are both gitignored, so this workflow's only durable output is what lands in S3.
#
# No `schedule` trigger. GitHub's own docs say the schedule event "can be delayed during
# periods of high loads" and dropped runs are not retried or reported — in practice, on a
# private low-traffic repo, that meant multi-hour gaps rather than the 5–30 minutes the
# docs describe. An external cron service calls workflow_dispatch on this workflow every
# hour instead, since dispatch-triggered runs skip that best-effort queue entirely. See
# docs/scheduling.md for the external trigger's setup.
on:
  workflow_dispatch:

concurrency:
  group: update-forecast
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        # Login shell so micromamba's activation (on ~/.bashrc) applies to every step,
        # not just the one right after it installs GDAL.
        shell: bash -el {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # isobands[gdal313] needs a matching system GDAL: the PyPI `gdal` package is a
      # thin binding compiled against whatever gdal-config reports. Ubuntu's apt repos
      # (and even the ubuntugis-unstable PPA) top out around 3.11, so GDAL 3.13 itself
      # comes from conda-forge, which tracks new releases fast. uv then installs into
      # that env instead of a venv it creates itself.
      - name: Install GDAL 3.13 via micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: gdal-env
          # libgdal-grib is a separate conda-forge plugin package — the GRIB driver and
          # its bundled table data (grib2_table_4_5.csv etc.) aren't in the base `gdal`
          # package, and NDFD data comes over the wire as GRIB2.
          create-args: python=3.12 gdal=3.13 libgdal-grib

      - name: Point uv at the micromamba env
        run: echo "UV_PROJECT_ENVIRONMENT=${MAMBA_ROOT_PREFIX}/envs/gdal-env" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra publish

      - name: Set up data and build directories
        run: make setup

      - name: Run the forecast pipeline
        run: make build

      - name: Publish to S3
        env:
          MY_AWS_ACCESS_KEY_ID: ${{ secrets.MY_AWS_ACCESS_KEY_ID }}
          MY_AWS_SECRET_ACCESS_KEY: ${{ secrets.MY_AWS_SECRET_ACCESS_KEY }}
          MY_DEFAULT_REGION: ${{ secrets.MY_DEFAULT_REGION }}
        run: make publish

      - name: Upload build for debugging on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-build
          path: |
            build/failed
            build/*.staging
          retention-days: 3
          if-no-files-found: ignore

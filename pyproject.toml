[project]
name = "feelslike-la"
version = "0.1.0"
description = "Hyperlocal apparent-temperature forecasts for Los Angeles County"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "geopandas>=1.0",
    "isobands[gdal313]>=0.2",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyproj>=3.6",
    "rasterio>=1.4",
    "requests>=2.32",
    "shapely>=2.0",
    "xarray>=2024.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
publish = ["boto3>=1.34"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feelslike_la"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

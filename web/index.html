<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Feels Like LA</title>
    <meta
      name="description"
      content="What it will feel like across Los Angeles County over the next 24 hours, from National Weather Service forecasts."
    />
    <meta name="color-scheme" content="light" />
  </head>
  <body>
    <a class="skip-link" href="#forecast">Skip to the forecast</a>

    <header class="masthead">
      <div class="masthead-inner">
        <p class="eyebrow">National Weather Service forecast</p>
        <h1>Feels Like LA</h1>
        <p class="hero-summary" id="hero-summary">Loading the latest LA temperature spread…</p>
      </div>
    </header>

    <main>
      <section class="map-panel" aria-labelledby="map-heading">
        <h2 class="visually-hidden" id="map-heading">Across LA at this hour</h2>

        <div class="finder-row">
          <div class="finder">
            <div id="search"></div>
            <button class="locate" id="locate" type="button">Use my location</button>
            <p class="locate-status" id="locate-status" role="status"></p>
          </div>
        </div>

        <div class="map-frame">
          <!-- #map-shell holds only the map itself and its legend. A map that cannot
               start replaces just this, so the search above and the card beside it
               keep working -- see setMapMessage() in main.ts. -->
          <div id="map-shell">
            <div class="map-topbar">
              <div id="legend" class="legend"></div>
            </div>
            <div id="map" role="img"></div>
          </div>

          <section class="card hero-card" id="forecast" aria-labelledby="card-place" aria-busy="true">
            <div id="card"></div>
          </section>
        </div>

        <div class="slider-panel">
          <div id="slider"></div>
        </div>
      </section>

      <section class="panel" aria-labelledby="chart-heading">
        <h2 class="panel-heading" id="chart-heading">Next 24 hours</h2>
        <div id="chart"></div>
      </section>

      <section class="panel" aria-labelledby="compare-heading">
        <h2 class="panel-heading" id="compare-heading">Compare with another place</h2>
        <div id="compare"></div>
      </section>
    </main>

    <footer class="site-footer" id="notes"></footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Feels Like LA</title>
    <meta
      name="description"
      content="What it will feel like across Los Angeles County over the next 24 hours, from National Weather Service forecasts."
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#fefefe" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://feelslike.la/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Feels Like LA" />
    <meta property="og:title" content="Feels Like LA" />
    <meta
      property="og:description"
      content="What it will feel like across Los Angeles County over the next 24 hours, from National Weather Service forecasts."
    />
    <meta property="og:image" content="https://feelslike.la/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://feelslike.la/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Feels Like LA" />
    <meta
      name="twitter:description"
      content="What it will feel like across Los Angeles County over the next 24 hours, from National Weather Service forecasts."
    />
    <meta name="twitter:image" content="https://feelslike.la/og-image.png" />
  </head>
  <body>
    <a class="skip-link" href="#hero">Skip to the forecast</a>

    <header class="masthead">
      <!-- Names the place on screen, not just the brand — see writeWordmark() in
           main.ts. "LA Feels Like" until a place resolves, then "Downtown LA Feels
           Like" or, for a standalone city like Culver City, "Culver City Feels Like"
           with no redundant "LA." -->
      <p class="wordmark" id="wordmark">LA <strong>Feels Like</strong></p>
      <p class="status-chip" id="status-chip" role="status"></p>
    </header>

    <main>
      <div class="layout">
        <!-- Search, place name, the big number and the peak line — see hero.ts. The
             reader's first three questions (where, what does it feel like, when does it
             peak) answered in one panel, before anything else on the page. -->
        <div id="hero" class="summary-panel" role="region" aria-label="Current reading"></div>

        <section class="chart-panel" aria-labelledby="chart-heading">
          <h2 class="panel-heading" id="chart-heading">Next 24 hours</h2>
          <div id="chart"></div>
        </section>

        <!-- Map, legend and the shared timeline live in one card, not three — the
             timeline scrubs both this map and the chart above, so it is docked to the
             bottom of the map rather than floating in its own box that has nothing of
             its own height to answer to. #map-shell holds just the map and its legend;
             a map that cannot start replaces only that div, so the timeline (and the
             rest of the page) keeps working — see setMapMessage() in main.ts. -->
        <section class="map-panel" aria-labelledby="map-heading">
          <h2 class="visually-hidden" id="map-heading">
            Map of apparent temperature across Los Angeles County at the selected hour
          </h2>
          <div id="map-shell">
            <div class="map-topbar">
              <div id="legend" class="legend"></div>
            </div>
            <div id="map" role="img"></div>
          </div>
          <div class="timeline-panel" id="timeline-panel">
            <div id="slider"></div>
            <p class="zone-note">All times Pacific.</p>
          </div>
        </section>

        <section class="panel compare-panel" aria-labelledby="compare-heading">
          <h2 class="panel-heading" id="compare-heading">Compare places</h2>
          <div id="compare"></div>
        </section>
      </div>
    </main>

    <footer class="site-footer" id="notes"></footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
